[package]
name = "smoovplay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SmoovPlay's macOS core: run.py and the framegen helpers the launcher calls, as one binary"

[[bin]]
name = "smoovplay"
path = "src/main.rs"

[dependencies]
sp-core.workspace = true
sp-rife = { path = "../sp-rife" }
sp-tap = { path = "../sp-tap" }
sp-media = { path = "../sp-media" }
sp-sched = { path = "../sp-sched" }
sp-present = { path = "../sp-present" }
sp-settings = { path = "../sp-settings" }
sp-replay = { path = "../sp-replay" }
sp-capture = { path = "../sp-capture" }
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-core-foundation.workspace = true
objc2-app-kit.workspace = true
serde_json.workspace = true
libc = "0.2.177"
