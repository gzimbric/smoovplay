[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# One version of each Apple binding for every crate (objc2 0.6 family).
[workspace.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-media = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-video-toolbox = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-metal-performance-shaders = "0.3.2"
objc2-metal-performance-shaders-graph = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
block2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sp-core = { path = "crates/sp-core" }

[profile.release]
debug = 1   # symbols for Instruments and crash reports
